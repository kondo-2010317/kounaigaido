<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#15191e">
  <title>AR校内ナビゲーション</title>
  <style>
    /* =====================================================================
       デザインルール（校舎の案内サイン）
       色   ：墨と紙の2色が基本。緑は「進め」の意味だけ（主操作・道順・この向き・到着）
              黄は通行止めの警告だけ
       文字 ：12 / 14 / 16 / 20 / 32px の5段階
       余白 ：4の倍数（4 / 8 / 12 / 16 / 24 / 32）
       角丸 ：6px と 正円 の2種類
       影   ：1種類（画面に重なるトーストだけ）
       ===================================================================== */
    :root {
      --ink: #15191e;
      --ink-2: #2c333b;
      --ink-line: #46505c;
      --on-ink: #f4f3ef;
      --on-ink-muted: #a9b0b9;

      --paper: #f4f3ef;
      --surface: #ffffff;
      --line: #d5d2c9;
      --text: #15191e;
      --muted: #5a626d;

      --accent: #00754a;
      --accent-press: #005c3a;
      --accent-on-ink: #4bd69d;
      --warn: #f2b705;
      --focus: #0b57d0;

      --t1: 12px;
      --t2: 14px;
      --t3: 16px;
      --t4: 20px;
      --t5: 32px;

      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 24px;
      --s6: 32px;

      --r: 6px;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", Meiryo, sans-serif;
      font-size: var(--t3);
      line-height: 1.6;
      font-variant-numeric: tabular-nums;
      -webkit-text-size-adjust: 100%;
    }

    h1, h2, h3, p, ol { margin: 0; padding: 0; }
    ol { list-style: none; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    svg { display: block; }

    .hidden { display: none !important; }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    /* ---------- ボタン ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--s2);
      min-height: 44px;
      padding: 0 var(--s4);
      border: 1px solid transparent;
      border-radius: var(--r);
      font-size: var(--t2);
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
    }
    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .btn:disabled { opacity: 0.55; cursor: default; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:active:not(:disabled) { background: var(--accent-press); }
    .btn-lg { width: 100%; min-height: 52px; font-size: var(--t3); }

    .btn-outline { background: var(--surface); border-color: var(--line); color: var(--text); }
    .btn-outline:active { background: var(--paper); }

    .btn-ink { background: var(--ink); color: var(--on-ink); padding: 0 var(--s3); }
    .btn-ink:active { background: var(--ink-2); }

    .btn-quiet { background: var(--ink-2); color: var(--on-ink); padding: 0 var(--s2); }
    .btn-quiet:active { background: var(--ink-line); }

    /* ---------- 背景（カメラ映像 / カメラが使えないとき） ---------- */
    #fallback-bg {
      position: fixed;
      inset: 0;
      background: var(--ink-2);
      z-index: 0;
    }
    #camera-feed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* ---------- トースト ---------- */
    #toast-container {
      position: fixed;
      top: calc(var(--s4) + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      width: calc(100% - var(--s6));
      max-width: 448px;
      display: flex;
      flex-direction: column;
      gap: var(--s2);
      pointer-events: none;
    }
    .toast {
      background: var(--ink);
      color: var(--on-ink);
      border: 1px solid var(--ink-line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: var(--s3) var(--s4);
      font-size: var(--t2);
      font-weight: 700;
      line-height: 1.5;
      transition: opacity 0.3s;
    }
    .toast.is-warn {
      background: var(--warn);
      border-color: var(--warn);
      color: var(--ink);
    }

    /* =====================================================================
       1. ホーム画面
       ===================================================================== */
    .home {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }
    .home-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: calc(var(--s6) + env(safe-area-inset-top, 0px)) var(--s4) var(--s5);
    }
    .home-inner {
      max-width: 480px;
      margin: 0 auto;
    }
    .home-head { margin-bottom: var(--s6); }
    .eyebrow {
      font-size: var(--t1);
      font-weight: 700;
      color: var(--muted);
      margin-bottom: var(--s1);
    }
    .home-head h1 {
      font-size: var(--t5);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .lead {
      font-size: var(--t2);
      color: var(--muted);
      margin-top: var(--s2);
    }

    .block { margin-bottom: var(--s6); }
    .label {
      display: block;
      font-size: var(--t2);
      font-weight: 700;
      margin-bottom: var(--s2);
    }
    .hint {
      font-size: var(--t1);
      color: var(--muted);
    }

    .select {
      width: 100%;
      min-height: 48px;
      padding: 0 var(--s3);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      font-size: var(--t3);
      font-weight: 700;
    }

    /* 階の絞り込み */
    .seg {
      display: flex;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--surface);
      overflow: hidden;
      margin-bottom: var(--s2);
    }
    .seg button {
      flex: 1;
      min-height: 44px;
      border: 0;
      border-left: 1px solid var(--line);
      background: transparent;
      font-size: var(--t2);
      font-weight: 700;
      color: var(--muted);
    }
    .seg button:first-child { border-left: 0; }
    .seg button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--on-ink);
    }
    .seg button:focus-visible { outline-offset: -3px; }

    /* 行き先リスト */
    .dest-list { border-top: 1px solid var(--line); }
    .dest {
      display: flex;
      align-items: center;
      gap: var(--s3);
      width: 100%;
      min-height: 60px;
      padding: var(--s3) var(--s2);
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
    }
    .dest[aria-checked="true"] { background: var(--surface); }
    .dest:focus-visible { outline-offset: -3px; }
    .dest-floor {
      flex-shrink: 0;
      width: 36px;
      font-size: var(--t2);
      font-weight: 700;
      color: var(--muted);
    }
    .dest-main { flex: 1; min-width: 0; }
    .dest-name {
      display: block;
      font-size: var(--t3);
      font-weight: 700;
      line-height: 1.4;
    }
    .dest-meta {
      display: block;
      font-size: var(--t1);
      color: var(--muted);
    }
    .tag {
      display: inline-block;
      margin-left: var(--s2);
      padding: 0 var(--s1);
      border: 1px solid var(--muted);
      border-radius: var(--r);
      font-size: var(--t1);
      font-weight: 700;
      color: var(--muted);
      vertical-align: 1px;
    }
    .dest-radio {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border: 2px solid var(--muted);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dest[aria-checked="true"] .dest-radio { border-color: var(--ink); }
    .dest[aria-checked="true"] .dest-radio::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ink);
    }

    .empty {
      padding: var(--s5) var(--s2);
      border-bottom: 1px solid var(--line);
      font-size: var(--t2);
      color: var(--muted);
    }
    .empty .btn { margin-top: var(--s3); }

    /* 歩幅 */
    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s4);
    }
    .field-row .label { margin-bottom: 0; }
    .stepper {
      display: flex;
      align-items: center;
      gap: var(--s2);
      flex-shrink: 0;
    }
    .stepper button {
      width: 44px;
      height: 44px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      font-size: var(--t4);
      font-weight: 700;
      line-height: 1;
    }
    .stepper button:active { background: var(--paper); }
    .stepper output {
      width: 64px;
      text-align: center;
      font-size: var(--t3);
      font-weight: 700;
    }

    .home-foot {
      flex-shrink: 0;
      padding: var(--s3) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom, 0px));
      background: var(--paper);
      border-top: 1px solid var(--line);
    }
    .home-foot .btn { max-width: 480px; margin: 0 auto; display: flex; }

    /* =====================================================================
       2. 校内図と道順（全画面シート）
       ===================================================================== */
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }
    .sheet-head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s3);
      padding: calc(var(--s3) + env(safe-area-inset-top, 0px)) var(--s4) var(--s3);
      border-bottom: 1px solid var(--line);
    }
    .sheet-head h2 {
      font-size: var(--t4);
      font-weight: 800;
      line-height: 1.3;
    }
    .sheet-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: var(--s4) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom, 0px));
    }
    .sheet-inner {
      max-width: 480px;
      margin: 0 auto;
    }
    .route-title {
      font-size: var(--t3);
      font-weight: 700;
      line-height: 1.4;
    }
    .route-meta {
      font-size: var(--t2);
      color: var(--muted);
      margin-bottom: var(--s4);
    }
    .map-frame {
      background: var(--ink);
      border-radius: var(--r);
      padding: var(--s2);
    }
    .map-legend {
      font-size: var(--t1);
      color: var(--muted);
      margin: var(--s2) 0 var(--s6);
    }
    .steps-title {
      font-size: var(--t2);
      font-weight: 700;
      margin-bottom: var(--s2);
    }
    .steps { border-top: 1px solid var(--line); }
    .step {
      display: flex;
      align-items: flex-start;
      gap: var(--s3);
      width: 100%;
      min-height: 56px;
      padding: var(--s3) var(--s2);
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
      font-size: var(--t2);
      color: var(--muted);
    }
    .step:focus-visible { outline-offset: -3px; }
    .step-num {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border: 1px solid var(--muted);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--t1);
      font-weight: 700;
      line-height: 1;
    }
    .step[aria-current="step"] {
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
    }
    .step[aria-current="step"] .step-num {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--on-ink);
    }

    /* =====================================================================
       3. 案内画面（カメラ映像の上に重ねる）
       ===================================================================== */
    .ar {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--s3);
      padding: calc(var(--s4) + env(safe-area-inset-top, 0px)) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom, 0px));
      color: var(--on-ink);
      pointer-events: none;
      --focus: #ffffff;
    }
    .ar > * {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    .ar button, .ar input { pointer-events: auto; }

    .ar-top { display: flex; flex-direction: column; gap: var(--s2); }
    .ar-bar { display: flex; align-items: center; gap: var(--s2); }
    .ar-bar .spacer { flex: 1; }

    /* 音声ボタン：オン・オフでアイコンを切り替える */
    #voice-btn .icon-off { display: none; }
    #voice-btn[aria-pressed="false"] .icon-on { display: none; }
    #voice-btn[aria-pressed="false"] .icon-off { display: block; }
    #voice-btn[aria-pressed="false"] { color: var(--on-ink-muted); }

    /* 残り距離などの表示 */
    .status {
      background: var(--ink);
      border-radius: var(--r);
      padding: var(--s3) var(--s4);
    }
    .status-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--s3);
      margin-bottom: var(--s1);
    }
    .status-dest {
      min-width: 0;
      font-size: var(--t2);
      font-weight: 700;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metrics {
      display: flex;
      align-items: flex-end;
      gap: var(--s5);
    }
    .metric-label {
      font-size: var(--t1);
      color: var(--on-ink-muted);
      line-height: 1.4;
    }
    .metric-value {
      font-size: var(--t4);
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
    }
    .metric.is-main { flex: 1; }
    .metric.is-main .metric-value {
      font-size: var(--t5);
      font-weight: 800;
      line-height: 1.15;
    }
    .unit {
      font-size: var(--t2);
      font-weight: 700;
      margin-left: 2px;
    }
    .progress {
      height: 4px;
      background: var(--ink-line);
      border-radius: 2px;
      overflow: hidden;
      margin-top: var(--s3);
    }
    #progress-bar {
      width: 0;
      height: 100%;
      background: var(--accent-on-ink);
      transition: width 0.3s;
    }
    #total-remaining {
      flex-shrink: 0;
      font-size: var(--t1);
      color: var(--on-ink-muted);
      white-space: nowrap;
    }

    /* 通行止めの知らせ */
    .alert {
      display: flex;
      align-items: flex-start;
      gap: var(--s2);
      background: var(--warn);
      color: var(--ink);
      border-radius: var(--r);
      padding: var(--s3) var(--s4);
      font-size: var(--t2);
      font-weight: 700;
      line-height: 1.5;
    }
    .alert svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }

    /* 進む向き・階段・到着 */
    .ar-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--s4);
    }
    .sign-row {
      display: flex;
      align-items: center;
      gap: var(--s2);
      width: 100%;
    }
    .sign-slot {
      flex: 1;
      min-width: 0;
      display: flex;
      justify-content: center;
    }
    .sign {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--s2);
    }
    .disc {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }
    .disc.is-go { background: var(--accent); }
    .disc svg { width: 72px; height: 72px; }
    #arrow-container {
      display: flex;
      transition: transform 0.2s ease-out;
    }
    .sign-label {
      background: var(--ink);
      border-radius: var(--r);
      padding: var(--s1) var(--s3);
      font-size: var(--t3);
      font-weight: 700;
      line-height: 1.5;
    }

    /* キャラクターと案内文 */
    .guide {
      display: flex;
      align-items: flex-end;
      gap: var(--s2);
      width: 100%;
    }
    #char-box { flex-shrink: 0; }
    #guide-char {
      display: block;
      height: 168px;
      width: auto;
      pointer-events: none;
    }
    #guide-robot { width: 72px; height: 72px; }
    .guide-panel {
      flex: 1;
      min-width: 0;
      background: var(--surface);
      color: var(--text);
      border-radius: var(--r);
      padding: var(--s3) var(--s4) var(--s4);
    }
    #step-progress {
      font-size: var(--t1);
      font-weight: 700;
      color: var(--muted);
    }
    #guide-message {
      font-size: var(--t3);
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: var(--s3);
    }
    .guide-panel .btn { width: 100%; }

    @keyframes shakeChar {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    .char-alert { animation: shakeChar 0.5s ease-in-out 3; }

    /* 下段：テスト操作と校内図 */
    .ar-bottom { display: flex; flex-direction: column; gap: var(--s2); }
    .sim {
      background: var(--ink);
      border-radius: var(--r);
      padding: var(--s3) var(--s4);
    }
    .sim-head {
      display: flex;
      justify-content: space-between;
      font-size: var(--t2);
      font-weight: 700;
    }
    .sim input[type="range"] {
      display: block;
      width: 100%;
      height: 44px;
      margin: 0;
      accent-color: var(--accent-on-ink);
    }
    .test {
      background: var(--ink);
      border-radius: var(--r);
      padding: var(--s2);
    }
    .test-head {
      display: flex;
      justify-content: space-between;
      gap: var(--s2);
      font-size: var(--t1);
      color: var(--on-ink-muted);
      line-height: 1.4;
      margin-bottom: var(--s2);
      white-space: nowrap;
    }
    .test-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--s1);
    }
    .minimap {
      flex-shrink: 0;
      width: 128px;
      display: flex;
      flex-direction: column;
      gap: var(--s1);
      background: var(--ink);
      color: var(--on-ink);
      border: 0;
      border-radius: var(--r);
      padding: var(--s2);
      text-align: left;
    }
    .minimap:active { background: var(--ink-2); }
    .minimap-caption {
      display: flex;
      justify-content: space-between;
      font-size: var(--t1);
      font-weight: 700;
      line-height: 1.4;
    }
    .minimap-caption span:last-child { color: var(--on-ink-muted); font-weight: 400; }
    #mini-map-svg-box { display: block; }

    /* 地図：現在地の点滅 */
    @keyframes pulseMarker {
      0% { transform: scale(0.9); opacity: 0.9; }
      70%, 100% { transform: scale(2.2); opacity: 0; }
    }
    .marker-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseMarker 1.8s infinite;
    }

    /* 背の低い画面では縦を詰める */
    @media (max-height: 720px) {
      .disc { width: 96px; height: 96px; }
      .disc svg { width: 56px; height: 56px; }
      #guide-char { height: 132px; }
      .ar-mid { gap: var(--s3); }
    }
    @media (max-height: 640px) {
      .ar { gap: var(--s2); padding-top: var(--s3); padding-bottom: var(--s3); }
      .disc { width: 72px; height: 72px; }
      .disc svg { width: 44px; height: 44px; }
      .ar-mid { gap: var(--s2); }
      #guide-char { height: 112px; }
    }

    /* 動きを減らす設定を尊重 */
    @media (prefers-reduced-motion: reduce) {
      .marker-pulse, .char-alert { animation: none; }
      #arrow-container, #progress-bar, .disc, .toast { transition: none; }
    }
  </style>
</head>
<body>

  <!-- カメラが使えないときの背景 -->
  <div id="fallback-bg"></div>

  <!-- 背面カメラ映像 -->
  <video id="camera-feed" autoplay playsinline muted aria-hidden="true"></video>

  <!-- 一時的な知らせ -->
  <div id="toast-container" role="status" aria-live="polite"></div>

  <!-- ===================================================================== -->
  <!-- 1. ホーム画面（今いる場所・行き先の選択）                              -->
  <!-- ===================================================================== -->
  <main id="start-screen" class="home">
    <div class="home-body">
      <div class="home-inner">
        <header class="home-head">
          <p class="eyebrow">福井県立科学技術高等学校</p>
          <h1>AR校内ナビゲーション</h1>
          <p class="lead">今いる場所と行き先を選ぶと、カメラの画面に進む向きを表示します。</p>
        </header>

        <section class="block">
          <label class="label" for="start-select">今いる場所</label>
          <select id="start-select" class="select"></select>
        </section>

        <section class="block" aria-labelledby="dest-label">
          <span class="label" id="dest-label">行き先</span>
          <div class="seg" id="floor-tabs" role="group" aria-label="階で絞り込む">
            <button type="button" class="floor-tab" data-floor="all" aria-pressed="true">すべて</button>
            <button type="button" class="floor-tab" data-floor="1F" aria-pressed="false">1階</button>
            <button type="button" class="floor-tab" data-floor="2F" aria-pressed="false">2階</button>
            <button type="button" class="floor-tab" data-floor="3F" aria-pressed="false">3階</button>
            <button type="button" class="floor-tab" data-floor="4F" aria-pressed="false">4階</button>
          </div>
          <div id="route-list" class="dest-list" role="radiogroup" aria-labelledby="dest-label">
            <!-- JSで行き先の一覧を生成 -->
          </div>
        </section>

        <section class="block">
          <div class="field-row">
            <div>
              <span class="label" id="step-len-label">歩幅</span>
              <span class="hint">身長×0.45が目安です</span>
            </div>
            <div class="stepper" role="group" aria-labelledby="step-len-label">
              <button type="button" id="step-len-minus" aria-label="歩幅を短くする">−</button>
              <output id="step-len-display" aria-live="polite">0.70m</output>
              <button type="button" id="step-len-plus" aria-label="歩幅を長くする">＋</button>
            </div>
          </div>
        </section>
      </div>
    </div>

    <footer class="home-foot">
      <button type="button" id="start-btn" class="btn btn-primary btn-lg">
        <span id="start-btn-text">案内を始める</span>
      </button>
    </footer>

    <!-- 上段：操作と残り距離 -->
    <div class="ar-top">
      <div class="ar-bar">
        <button type="button" id="back-home-btn" class="btn btn-ink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>

        <span class="spacer"></span>
        <button type="button" id="voice-btn" class="btn btn-ink" aria-pressed="true">
          <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9a4 4 0 010 6M19 6.5a8 8 0 010 11"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>

          <svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 60h14V46h14V32h14V18h12"/></svg>

        </div>
        <div class="sign-label">到着しました</div>
      </div>

      </div>
        <!-- 校内図（押すと全画面で開く） -->
        <button type="button" id="mini-map-widget" class="minimap" aria-label="校内図と道順を開く">

        </button>
      </div>

        </div>
      </div>

        </div>
      </div>
    </div>

    const openMapBtn = document.getElementById('open-map-btn');
    const closeMapBtn = document.getElementById('close-map-btn');
    const mapVisualContainer = document.getElementById('map-visual-container');
    const miniMapWidget = document.getElementById('mini-map-widget');
    const miniMapSvgBox = document.getElementById('mini-map-svg-box');
    const miniMapFloor = document.getElementById('mini-map-floor');

    // テスト操作
    const testStepBtn = document.getElementById('test-step-btn');
    const testAdvanceBtn = document.getElementById('test-advance-btn');
    const testDetourBtn = document.getElementById('test-detour-btn');

    // =========================================================================
    // 4. ヘルパー関数（表示切替・トースト・角度計算・歩幅・音声・キャラクター）
    // =========================================================================
    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden'); }

    function showToast(message, type = "info") {
      if (!toastContainer) return;
      const toast = document.createElement('div');
      toast.className = type === "warn" ? "toast is-warn" : "toast";
      toast.textContent = message;
      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // 角度を0〜360°に収める
    function normalizeAngle(deg) {
      return ((deg % 360) + 360) % 360;
    }

    // currentからtargetへ最短で回るときの角度差（-180〜180°）
    function angleDiff(target, current) {
      return ((target - current) % 360 + 540) % 360 - 180;
    }

    function getDirectionName(deg) {
      const dirs = ["北", "北東", "東", "南東", "南", "南西", "西", "北西"];
      const idx = Math.round(normalizeAngle(deg) / 45) % 8;
      return dirs[idx];
    }

    function getPlace(id) {
      return PLACES.find(p => p.id === id) || PLACES[0];
    }

    function updateStepLengthUI() {
      stepLenDisplay.textContent = `${stepLength.toFixed(2)}m`;
      saveSettings();
    }

    stepLenMinus.addEventListener('click', () => {
      stepLength = Math.max(0.40, Math.round((stepLength - 0.05) * 100) / 100);
      updateStepLengthUI();
    });

    stepLenPlus.addEventListener('click', () => {
      stepLength = Math.min(1.20, Math.round((stepLength + 0.05) * 100) / 100);
      updateStepLengthUI();
    });

    // 音声案内（Web Speech API）
    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text.replace(/[【】]/g, ''));
        utter.lang = 'ja-JP';
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function stopSpeaking() {
      try {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      } catch (e) {}
    }

    function announceCurrentStep(prefix = "") {
      if (!activeRoute) return;
      const step = activeRoute.steps[currentStepIndex];
      if (step) speak(prefix + step.text);
    }

    // キャラクターのポーズ切り替え（durationMsを指定すると、その後は立ち姿に戻る）
    function setCharPose(pose, durationMs = 0) {
      clearTimeout(charPoseTimer);
      if (CHAR_IMAGES[pose]) guideChar.src = CHAR_IMAGES[pose];

      charBox.classList.remove('char-alert');
      if (pose === 'alert') {
        void charBox.offsetWidth; // アニメーションを最初からやり直す
        charBox.classList.add('char-alert');
      }

      if (durationMs > 0) {
        charPoseTimer = setTimeout(() => setCharPose('idle'), durationMs);
      }
    }

    function initCharacter() {
      if (CHAR_IMAGES.idle) {
        guideChar.src = CHAR_IMAGES.idle;
        show(guideChar);
        hide(guideRobot);
      }
    }

    // =========================================================================
    // 5. 経路計算（校内グラフから最短経路を探し、案内ステップを自動生成）
    // =========================================================================
    function edgeKey(a, b) {
      return a < b ? `${a}|${b}` : `${b}|${a}`;
    }

    const EDGE_MAP = {};   // "A|B" → { dist, stairs }
    const NEIGHBORS = {};  // 地点 → 隣の地点リスト
    EDGES.forEach(([a, b, dist, type]) => {
      EDGE_MAP[edgeKey(a, b)] = { a, b, dist, stairs: type === "stairs" };
      (NEIGHBORS[a] = NEIGHBORS[a] || []).push(b);
      (NEIGHBORS[b] = NEIGHBORS[b] || []).push(a);
    });

    // ダイクストラ法：blocked（通れない通路）を避けた最短経路を地点の並びで返す
    function findPath(startNode, goalNode, blocked) {
      const dist = {};
      const prev = {};
      const done = new Set();
      Object.keys(NODES).forEach(id => { dist[id] = Infinity; });
      dist[startNode] = 0;

      while (true) {
        let current = null;
        Object.keys(NODES).forEach(id => {
          if (!done.has(id) && dist[id] < Infinity && (current === null || dist[id] < dist[current])) current = id;
        });
        if (current === null) return null;       // これ以上たどれない＝経路なし
        if (current === goalNode) break;
        done.add(current);

        (NEIGHBORS[current] || []).forEach(next => {
          const key = edgeKey(current, next);
          if (blocked && blocked.has(key)) return;
          const d = dist[current] + EDGE_MAP[key].dist;
          if (d < dist[next]) {
            dist[next] = d;
            prev[next] = current;
          }
        });
      }

      const path = [goalNode];
      while (path[0] !== startNode) path.unshift(prev[path[0]]);
      return path;
    }

    // 校内図上の2地点から進む方角を求める（上が北）
    function bearingOf(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      if (Math.abs(dx) >= Math.abs(dy)) return dx > 0 ? 90 : 270;
      return dy < 0 ? 0 : 180;
    }

    // 地点の並びから案内ステップを作る
    //   同じ方角が続く通路は1ステップにまとめ、階段は「◯階→◯階」の1ステップにする
    function buildSteps(path, opts) {
      const { dest, startPlace = null, isRouteStart = false, prevBearing = null } = opts;

      const groups = [];
      for (let i = 0; i < path.length - 1; i++) {
        const key = edgeKey(path[i], path[i + 1]);
        const edge = EDGE_MAP[key];
        const bearing = edge.stairs ? null : bearingOf(NODES[path[i]], NODES[path[i + 1]]);
        const last = groups[groups.length - 1];
        if (last && last.isStairs === edge.stairs && (edge.stairs || last.bearing === bearing)) {
          last.nodes.push(path[i + 1]);
          last.distance += edge.dist;
          last.edges.push(key);
        } else {
          groups.push({ isStairs: edge.stairs, bearing, nodes: [path[i], path[i + 1]], distance: edge.dist, edges: [key] });
        }
      }

      const steps = [];
      let heading = prevBearing;
      groups.forEach((g, gi) => {
        const firstId = g.nodes[0];
        const lastId = g.nodes[g.nodes.length - 1];
        const first = NODES[firstId];
        const last = NODES[lastId];

        if (g.isStairs) {
          const up = last.f > first.f;
          steps.push({
            floor: `${first.f}階→${last.f}階`, fl: first.f, distance: g.distance,
            isStairs: true, targetFloor: `${last.f}階`, up, bearing: 0,
            from: [first.x, first.y], to: [last.x, last.y], endNode: lastId, edges: g.edges,
            text: `${first.label}で【${last.f}階】まで${up ? '上がって' : '下りて'}ください（着いたら下のボタンを押してください）。`
          });
          heading = null;
          return;
        }

        const dir = getDirectionName(g.bearing);
        let lead;
        if (gi === 0 && isRouteStart) {
          lead = startPlace && startPlace.node === "ENT"
            ? `生徒玄関を入ってまっすぐ（${dir}へ）、`
            : `【${startPlace ? startPlace.short : first.label}】を出発！矢印の向き（${dir}）へ、`;
        } else if (heading === null) {
          lead = `${first.f}階に着きました！矢印の向き（${dir}）へ、`;
        } else {
          const turn = normalizeAngle(g.bearing - heading);
          if (turn === 90) lead = `右（${dir}）へ曲がり、`;
          else if (turn === 270) lead = `左（${dir}）へ曲がり、`;
          else if (turn === 180) lead = `来た道を引き返して（${dir}へ）、`;
          else lead = `そのまま（${dir}へ）、`;
        }

        const isLastGroup = gi === groups.length - 1;
        const target = isLastGroup ? `【${dest.short}】` : last.label;
        const vias = g.nodes.slice(1, -1).map(id => NODES[id].via).filter(Boolean);
        const viaText = vias.length ? `途中、${vias.join('・')}の前を通ります。` : '';

        steps.push({
          floor: `${first.f}階`, fl: first.f, distance: g.distance, bearing: g.bearing,
          from: [first.x, first.y], to: [last.x, last.y], endNode: lastId, edges: g.edges,
          text: `${lead}${target}まで${g.distance}m進んでください。${viaText}`
        });
        heading = g.bearing;
      });

      const goal = NODES[path[path.length - 1]];
      steps.push({
        floor: `${goal.f}階`, fl: goal.f, distance: 0, bearing: null,
        from: [goal.x, goal.y], to: [goal.x, goal.y], endNode: path[path.length - 1], edges: [],
        text: `【${dest.short}】に到着しました！お疲れ様でした。`
      });
      return steps;
    }

    function finalizeRoute(route) {
      route.total = route.steps.reduce((sum, s) => sum + s.distance, 0);
      route.stairFloors = route.steps.filter(s => s.isStairs).map(s => s.targetFloor);
      return route;
    }

    // 今いる場所と行き先からルートを作る（経路が無ければnull）
    function computeRoute(startId, destId, blocked) {
      const start = getPlace(startId);
      const dest = getPlace(destId);
      if (start.id === dest.id) return null;
      const path = findPath(start.node, dest.node, blocked);
      if (!path) return null;
      return finalizeRoute({
        start, dest, name: dest.name,
        steps: buildSteps(path, { dest, startPlace: start, isRouteStart: true })
      });
    }

    function getActiveRoute() {
      return activeRoute;
    }

    // =========================================================================
    // 6. ホーム画面：今いる場所 ＆ 行き先の一覧 ＆ 階の絞り込み
    // =========================================================================
    function renderStartSelect() {
      startSelect.innerHTML = PLACES.map(p =>
        `<option value="${p.id}" ${p.id === selectedStartId ? 'selected' : ''}>${p.name}</option>`
      ).join('');
    }

    function updateStartButton() {
      startBtn.disabled = isStarting;
      startBtnText.textContent = isStarting
        ? 'カメラとセンサーを準備しています…'
        : `${getPlace(selectedRouteId).short}へ案内を始める`;
    }

    function renderRouteList() {
      // 今いる場所と同じ場所は行き先にできないので、別の場所を選び直す
      if (selectedRouteId === selectedStartId) {
        selectedRouteId = PLACES.find(p => p.id !== selectedStartId).id;
      }

      const candidates = PLACES.filter(p => p.id !== selectedStartId);
      const filtered = currentFilterFloor === "all"
        ? candidates
        : candidates.filter(p => p.floor === currentFilterFloor);

      if (filtered.length === 0) {
        // 空の状態：理由と、抜け出す操作を示す
        routeListEl.innerHTML = `
          <div class="empty">
            <p>この階には、選べる行き先がありません。</p>
            <button type="button" class="btn btn-outline" onclick="resetFloorFilter()">すべての階を表示する</button>
          </div>`;
        updateStartButton();
        return;
      }

      routeListEl.innerHTML = filtered.map(place => {
        const isSelected = place.id === selectedRouteId;
        const route = computeRoute(selectedStartId, place.id, null);
        const summary = route
          ? `約${route.total}m・${route.stairFloors.length ? `階段で${route.stairFloors[route.stairFloors.length - 1]}へ` : '階段なし'}`
          : 'ここへの道順が見つかりません';
        return `
          <button type="button" class="dest" role="radio" aria-checked="${isSelected}" onclick="selectRoute('${place.id}')">
            <span class="dest-floor">${place.floor.replace('F', '階')}</span>
            <span class="dest-main">
              <span class="dest-name">${place.title}${place.badge ? `<span class="tag">${place.badge}</span>` : ''}</span>
              <span class="dest-meta">${summary}</span>
            </span>
            <span class="dest-radio" aria-hidden="true"></span>
          </button>
        `;
      }).join('');

      updateStartButton();
    }

    window.selectRoute = function(routeId) {
      selectedRouteId = routeId;
      saveSettings();
      renderRouteList();
    };

    startSelect.addEventListener('change', () => {
      selectedStartId = startSelect.value;
      renderRouteList();
      saveSettings();
    });

    function setFloorFilter(floor) {
      currentFilterFloor = floor;
      document.querySelectorAll('.floor-tab').forEach(tab => {
        tab.setAttribute('aria-pressed', String(tab.dataset.floor === floor));
      });
      renderRouteList();
    }

    window.resetFloorFilter = function() {
      setFloorFilter('all');
    };

    document.querySelectorAll('.floor-tab').forEach(tab => {
      tab.addEventListener('click', () => setFloorFilter(tab.dataset.floor));
    });

    // =========================================================================
    // 7. 校内図SVG（右下の小さい図 ＆ 全画面の図で共通）
    //    建物は灰色の面、道順だけ緑。小さい図では部屋名を省いて形と位置だけ見せる。
    // =========================================================================
    const MAP_COLOR = {
      bg: '#15191e', building: '#2c333b', buildingLine: '#46505c', corridor: '#232930',
      stairs: '#5a626d', onStairs: '#f4f3ef', label: '#a9b0b9', route: '#4bd69d', warn: '#f2b705', now: '#ffffff'
    };

    function buildSchoolMapSVG(route, stepIndex, isMini = false) {
      const C = MAP_COLOR;
      const steps = route.steps;
      const currentStep = steps[stepIndex] || steps[0];
      const fl = currentStep.fl;
      const dim = fl === 1 ? 1 : 0.35; // 1階にしか無いもの（体育館・玄関・渡り廊下）は他の階で薄くする

      // 現在地：ステップの始点から終点へ、進んだ距離の割合だけ動かす
      const fraction = (stepIndex === currentStepIndex && currentStep.distance > 0)
        ? Math.min(1, currentStepDistance / currentStep.distance) : 0;
      const curX = currentStep.from[0] + (currentStep.to[0] - currentStep.from[0]) * fraction;
      const curY = currentStep.from[1] + (currentStep.to[1] - currentStep.from[1]) * fraction;

      // 道順の線：今いる階の区間は実線、ほかの階の区間は薄い破線
      const routeLines = steps.filter(s => !s.isStairs && s.bearing !== null).map(s => {
        const onFloor = s.fl === fl;
        return `<line x1="${s.from[0]}" y1="${s.from[1]}" x2="${s.to[0]}" y2="${s.to[1]}" stroke="${C.route}" stroke-width="${onFloor ? 4 : 2}" stroke-linecap="round" ${onFloor ? '' : 'stroke-dasharray="4 4" opacity="0.45"'}/>`;
      }).join('');

      // 通行止め（混雑・工事）の通路
      const blockedMarks = [...blockedEdges].map(key => {
        const edge = EDGE_MAP[key];
        const a = NODES[edge.a];
        const b = NODES[edge.b];
        if (a.f !== fl && b.f !== fl) return '';
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        const line = edge.stairs ? '' : `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${C.warn}" stroke-width="4" stroke-linecap="round"/>`;
        return `${line}<circle cx="${mx}" cy="${my}" r="8" fill="${C.warn}"/><path d="M${mx - 3.5} ${my - 3.5}l7 7M${mx + 3.5} ${my - 3.5}l-7 7" stroke="${C.bg}" stroke-width="2" stroke-linecap="round"/>`;
      }).join('');

      const startNode = NODES[route.start.node];
      const goalNode = NODES[route.dest.node];

      // 部屋名（全画面の図だけ）。道順の線と重ならないよう、線の通らない位置に置く
      let labels = '';
      if (!isMini) {
        const text = (x, y, str, { anchor = 'middle', opacity = 1, fill = C.label, weight = 'normal' } = {}) =>
          `<text x="${x}" y="${y}" fill="${fill}" font-size="11" font-weight="${weight}" text-anchor="${anchor}" opacity="${opacity}">${str}</text>`;
        const center = fl <= 3
          ? [5, 4, 3, 2, 1].map((n, i) => text(140, 94 + i * 17, `${fl}-${n}`, { anchor: 'end' })).join('')
          : '';
        const east = { 1: ["保健室", "職員室"], 2: ["メディア", "進路指導"], 3: ["図書室", "音楽美術"], 4: ["", ""] }[fl] || ["", ""];
        const west = fl === 4 ? "被服室・製図実習" : "第1実験実習棟";
        const stairsLabel = { fill: C.onStairs, weight: 'bold' };
        labels = `
          ${text(195, 32, "体育館", { opacity: dim })}
          ${text(52, 59, west)}
          ${center}
          ${text(314, 96, east[0], { anchor: 'start' })}
          ${text(314, 138, east[1], { anchor: 'start' })}
          ${text(52, 175.5, "階段", stairsLabel)}
          ${text(167, 175.5, "階段", stairsLabel)}
          ${text(287, 175.5, "階段", stairsLabel)}
          ${text(132, 215, "生徒玄関", { opacity: dim })}
        `;
      }

      return `
        <svg viewBox="0 0 360 220" width="100%" role="img" aria-label="${fl}階の校内図">
          <rect width="360" height="220" fill="${C.bg}"/>

          <!-- 渡り廊下（北・南）※棟どうしの行き来は1階 -->
          <rect x="75" y="65" width="190" height="12" fill="${C.corridor}" opacity="${dim}"/>
          <rect x="75" y="168" width="190" height="12" fill="${C.corridor}" opacity="${dim}"/>

          <!-- 体育館（北） -->
          <rect x="150" y="10" width="90" height="35" rx="2" fill="${C.building}" stroke="${C.buildingLine}" opacity="${dim}"/>

          <!-- 西：第1実験実習教棟 / 中央：普通教室棟 / 東：管理・特別教室棟 -->
          <rect x="30" y="65" width="45" height="115" rx="2" fill="${C.building}" stroke="${C.buildingLine}"/>
          <rect x="145" y="65" width="44" height="115" rx="2" fill="${C.building}" stroke="${C.buildingLine}"/>
          <rect x="265" y="65" width="45" height="115" rx="2" fill="${C.building}" stroke="${C.buildingLine}"/>

          <!-- 階段 -->
          <rect x="37" y="164" width="30" height="15" rx="2" fill="${C.stairs}"/>
          <rect x="152" y="164" width="30" height="15" rx="2" fill="${C.stairs}"/>
          <rect x="272" y="164" width="30" height="15" rx="2" fill="${C.stairs}"/>

          <!-- 生徒玄関（南） -->
          <rect x="108" y="186" width="48" height="16" rx="2" fill="${C.building}" stroke="${C.buildingLine}" opacity="${dim}"/>

          ${labels}

          <!-- 道順 -->
          ${routeLines}

          <!-- 通行止め -->
          ${blockedMarks}

          <!-- 出発した場所（灰色の輪） -->
          <circle cx="${startNode.x}" cy="${startNode.y}" r="4" fill="${C.bg}" stroke="${C.label}" stroke-width="2" opacity="${startNode.f === fl ? 1 : 0.4}"/>

          <!-- 行き先（緑の二重丸） -->
          <g opacity="${goalNode.f === fl ? 1 : 0.45}">
            <circle cx="${goalNode.x}" cy="${goalNode.y}" r="8" fill="${C.bg}" stroke="${C.route}" stroke-width="2.5"/>
            <circle cx="${goalNode.x}" cy="${goalNode.y}" r="3.5" fill="${C.route}"/>
          </g>

          <!-- 現在地（白い点） -->
          <circle cx="${curX}" cy="${curY}" r="8" fill="${C.now}" class="marker-pulse"/>
          <circle cx="${curX}" cy="${curY}" r="6" fill="${C.now}" stroke="${C.bg}" stroke-width="2.5"/>
        </svg>
      `;
    }

    function updateMiniMap() {
      miniMapSvgBox.innerHTML = buildSchoolMapSVG(activeRoute, currentStepIndex, true);
      miniMapFloor.textContent = `校内図 ${activeRoute.steps[currentStepIndex].fl}階`;
    }

    function renderFloorMapModal() {
      const route = activeRoute;
      if (!route) return;
      const fl = route.steps[currentStepIndex].fl;
      const stairsNote = route.stairFloors.length ? `階段で${route.stairFloors.join('、')}へ` : '階段なし';
      mapVisualContainer.innerHTML = `
        <p class="route-title">${route.start.short} から ${route.dest.title}</p>
        <p class="route-meta">約${route.total}m・${stairsNote}${blockedEdges.size ? '・通行止めを避けた道順' : ''}</p>

        <div class="map-frame">
          ${buildSchoolMapSVG(route, currentStepIndex, false)}
        </div>
        <p class="map-legend">${fl}階の図です。白い点が現在地、緑の二重丸が行き先、緑の線が道順${blockedEdges.size ? '、黄色の×が通行止め' : ''}です。</p>

        <h3 class="steps-title">道順（押すと、その手順から案内します）</h3>
        <ol class="steps">
          ${route.steps.map((s, idx) => `
            <li>
              <button type="button" class="step" onclick="jumpToStep(${idx})" ${idx === currentStepIndex ? 'aria-current="step"' : ''}>
                <span class="step-num">${idx + 1}</span>
                <span>${s.text}</span>
              </button>
            </li>
          `).join('')}
        </ol>
      `;
    }

    window.jumpToStep = function(idx) {
      currentStepIndex = idx;
      currentStepDistance = 0;
      updateUI();
      renderFloorMapModal();
      announceCurrentStep();
    };

    function openMapModal() {
      renderFloorMapModal();
      show(mapModal);
      closeMapBtn.focus();
    }

    function closeMapModal() {
      hide(mapModal);
    }

    openMapBtn.addEventListener('click', openMapModal);
    miniMapWidget.addEventListener('click', openMapModal);
    closeMapBtn.addEventListener('click', closeMapModal);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !mapModal.classList.contains('hidden')) closeMapModal();
    });

    // =========================================================================
    // 8. 効果音・振動・ナビゲーションロジック
    // =========================================================================
    function playStepSound(isGoal = false) {
      try {
        // AudioContextは1つだけ作って使い回す（毎回作るとブラウザの上限に達して鳴らなくなる）
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const ctx = audioCtx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.type = 'sine';
        const now = ctx.currentTime;

        if (isGoal) {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.14);
          osc.frequency.setValueAtTime(783.99, now + 0.28);
          osc.frequency.setValueAtTime(1046.50, now + 0.42);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
          osc.start(now);
          osc.stop(now + 0.8);
        } else {
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880.00, now + 0.12);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {}
    }

    // 手順が切り替わったことを、音と振動で知らせる（画面は光らせない）
    function triggerStepEffect(isGoal = false) {
      if (navigator.vibrate) {
        navigator.vibrate(isGoal ? [200, 100, 200, 100, 300] : [150]);
      }
      playStepSound(isGoal);
    }

    function updateUI() {
      if (!activeRoute) return;
      const steps = activeRoute.steps;
      const step = steps[currentStepIndex];

      activeRouteTitle.textContent = `${activeRoute.name} へ`;
      guideMessageEl.textContent = step.text;
      stepCountEl.innerHTML = `${stepCount}<span class="unit">歩</span>`;
      stepProgressEl.textContent = `手順 ${currentStepIndex + 1} / ${steps.length}`;
      currentFloorBadge.textContent = step.floor;

      // 全体の進み具合 ＆ 行き先までの残り距離（歩いた距離ベース）
      const walkedInStep = Math.min(step.distance, currentStepDistance);
      const doneDistance = steps.slice(0, currentStepIndex).reduce((sum, s) => sum + s.distance, 0) + walkedInStep;
      const progressPercent = activeRoute.total > 0 ? Math.min(100, Math.round((doneDistance / activeRoute.total) * 100)) : 100;
      progressBarEl.style.width = `${progressPercent}%`;
      totalRemainingEl.textContent = `到着まで あと ${Math.max(0, activeRoute.total - doneDistance).toFixed(0)}m`;

      // 右下の校内図を更新
      updateMiniMap();

      const remaining = Math.max(0, step.distance - currentStepDistance);
      remainingDistEl.innerHTML = `${remaining.toFixed(1)}<span class="unit">m</span>`;

      if (step.bearing === null) {
        // 到着
        distLabelEl.textContent = "行き先まで";
        hide(arrowWrapper);
        hide(stairsWrapper);
        show(goalBadge);
        nextStepBtnText.textContent = "行き先を選び直す";
      } else if (step.isStairs) {
        // 階段
        distLabelEl.textContent = "階段の残り";
        hide(arrowWrapper);
        hide(goalBadge);
        show(stairsWrapper);
        stairsTargetText.textContent = `${step.targetFloor}へ${step.up ? '上がる' : '下りる'}`;
        nextStepBtnText.textContent = `${step.targetFloor}に着いた`;
      } else {
        // 廊下を歩く
        distLabelEl.textContent = "次の案内まで";
        show(arrowWrapper);
        hide(stairsWrapper);
        hide(goalBadge);
        nextStepBtnText.textContent = "着いた・次へ";
        updateArrowRotation();
      }
    }

    function updateArrowRotation() {
      if (!activeRoute) return;
      const step = activeRoute.steps[currentStepIndex];
      if (!step || step.bearing === null) return;

      // 359°→0°のような境目でも矢印が一回転しないよう、最短の向きに回す
      const relativeAngle = normalizeAngle(step.bearing - currentHeading);
      arrowRotation += angleDiff(relativeAngle, arrowRotation);
      arrowContainer.style.transform = `rotate(${arrowRotation}deg)`;

      // 進む向きに体が向いたら、円を緑にして文字でも知らせる
      const aligned = relativeAngle <= 20 || relativeAngle >= 340;
      arrowRing.classList.toggle('is-go', aligned);
      const dir = getDirectionName(step.bearing);
      targetBearingBadge.textContent = aligned ? `${dir}へ・この向きです` : `${dir}へ`;
    }

    function advanceToNextStep() {
      const steps = activeRoute.steps;
      if (currentStepIndex < steps.length - 1) {
        currentStepDistance = 0;
        currentStepIndex++;
        const nextStep = steps[currentStepIndex];
        const isGoal = (nextStep.bearing === null);
        triggerStepEffect(isGoal);
        setCharPose('wave', isGoal ? 0 : 1800);
        updateUI();
        announceCurrentStep();
      }
    }

    function addDistance(meters) {
      if (!activeRoute) return;
      const currentStep = activeRoute.steps[currentStepIndex];
      if (!currentStep || currentStep.bearing === null) return;

      currentStepDistance += meters;

      if (currentStepDistance >= currentStep.distance) {
        advanceToNextStep();
      } else {
        updateUI();
      }
    }

    // 「着いた・次へ」ボタン
    nextStepBtn.addEventListener('click', () => {
      if (!activeRoute) return;
      const currentStep = activeRoute.steps[currentStepIndex];
      if (!currentStep) return;

      // 到着後は、行き先を選ぶ画面へ戻るボタンとして働く
      if (currentStep.bearing === null) {
        goHome();
        return;
      }

      // 残り距離分の歩数を補完して次の手順へ
      const remaining = Math.max(0, currentStep.distance - currentStepDistance);
      if (remaining > 0) {
        stepCount += Math.round(remaining / stepLength);
      }
      advanceToNextStep();
    });

    // 混雑・工事：この先の通路を通行止めにして、別の道を計算し直す
    //   将来はリアルタイムの混雑・工事データで呼び出す想定（今はテスト操作から実行）
    function triggerDetour() {
      if (!activeRoute) return;
      const steps = activeRoute.steps;
      const current = steps[currentStepIndex];
      if (current.bearing === null) {
        showToast("もう到着しています。");
        return;
      }

      // 今の手順の終点から先で、別の道がある通路を手前から順に探す
      for (let i = currentStepIndex + 1; i < steps.length; i++) {
        for (const key of steps[i].edges) {
          if (blockedEdges.has(key)) continue;
          blockedEdges.add(key);
          const path = findPath(current.endNode, activeRoute.dest.node, blockedEdges);
          if (path) {
            const newSteps = buildSteps(path, {
              dest: activeRoute.dest,
              prevBearing: current.isStairs ? null : current.bearing
            });
            activeRoute.steps = steps.slice(0, currentStepIndex + 1).concat(newSteps);
            finalizeRoute(activeRoute);

            show(alertBanner);
            clearTimeout(alertTimer);
            alertTimer = setTimeout(() => hide(alertBanner), 8000);
            setCharPose('alert', 4000);
            if (navigator.vibrate) navigator.vibrate([100, 60, 100, 60, 100]);
            speak("前方が混雑・工事中です。迂回します！新しいルートで案内します。");
            updateUI();
            if (!mapModal.classList.contains('hidden')) renderFloorMapModal();
            return;
          }
          blockedEdges.delete(key);
        }
      }
      showToast("この先に別の道がありません。今の道順のまま案内します。", "warn");
    }

    // =========================================================================
    // 9. センサー＆カメラ制御
    // =========================================================================
    // 歩数検出：加速度の大きさから重力ぶんを取り除き、歩いたときの「山」を数える
    function handleMotion(event) {
      const acc = event.accelerationIncludingGravity;
      if (!acc || acc.x === null) return;

      const magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      gravityEstimate = gravityEstimate * 0.98 + magnitude * 0.02; // ゆっくり追従＝重力成分
      const dynamic = magnitude - gravityEstimate;
      const now = Date.now();

      if (dynamic > STEP_THRESHOLD && !isStepPeak && (now - lastStepTime > STEP_COOLDOWN)) {
        isStepPeak = true;
        lastStepTime = now;
        stepCount++;
        addDistance(stepLength);
      } else if (dynamic < STEP_REARM) {
        isStepPeak = false;
      }
    }

    // コンパス：センサー値のブレをならして、矢印をなめらかに追従させる
    function handleOrientation(event) {
      if (isSimulatedHeading) return;

      let heading = null;
      if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
        heading = event.webkitCompassHeading;
      } else if (event.alpha !== null && event.alpha !== undefined) {
        heading = (360 - event.alpha) % 360;
      }

      if (heading !== null) {
        if (!hasHeading) {
          currentHeading = heading;
          hasHeading = true;
        } else {
          currentHeading = normalizeAngle(currentHeading + angleDiff(heading, currentHeading) * HEADING_SMOOTH);
        }
        const shown = Math.round(currentHeading) % 360;
        debugInfoEl.textContent = `方角 ${shown}° ${getDirectionName(shown)}`;
        updateArrowRotation();
      }
    }

    async function startCamera() {
      stopCamera();
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        cameraFeed.srcObject = cameraStream;
      } catch (err) {
        showToast("カメラを使えません。矢印と校内図だけで案内します。", "warn");
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      cameraFeed.srcObject = null;
    }

    // 案内中は画面が自動で消えないようにする（対応ブラウザのみ）
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    // アプリに戻ってきたときに画面点灯の維持をかけ直す
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !arUi.classList.contains('hidden')) {
        requestWakeLock();
      }
    });

    // 案内を終えて、行き先を選ぶ画面へ戻る（カメラ・センサー・音声を止める）
    function goHome() {
      window.removeEventListener('devicemotion', handleMotion);
      window.removeEventListener('deviceorientationabsolute', handleOrientation);
      window.removeEventListener('deviceorientation', handleOrientation);
      stopCamera();
      stopSpeaking();
      releaseWakeLock();
      clearTimeout(alertTimer);
      hide(alertBanner);
      setCharPose('idle');

      closeMapModal();
      hide(arUi);
      show(startScreen);
      renderRouteList();
    }

    function updateVoiceBtn() {
      voiceBtn.setAttribute('aria-pressed', String(voiceEnabled));
      voiceBtn.setAttribute('aria-label', voiceEnabled ? '音声案内：オン（押すと止める）' : '音声案内：オフ（押すと読み上げる）');
    }

    voiceBtn.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      saveSettings();
      updateVoiceBtn();
      if (voiceEnabled) {
        announceCurrentStep();
      } else {
        stopSpeaking();
        showToast("音声案内を止めました。");
      }
    });

    // =========================================================================
    // 10. イベントリスナー登録
    // =========================================================================
    startBtn.addEventListener('click', async () => {
      if (isStarting) return;
      blockedEdges.clear();
      const route = computeRoute(selectedStartId, selectedRouteId, null);
      if (!route) {
        showToast("この行き先への道順が見つかりません。別の行き先を選んでください。", "warn");
        return;
      }

      // 準備中：許可の確認を待つあいだ、ボタンを止めて状況を伝える
      isStarting = true;
      updateStartButton();

      try {
        activeRoute = route;
        currentStepIndex = 0;
        stepCount = 0;
        currentStepDistance = 0;
        hasHeading = false;

        // iPhoneではセンサー許可はタップ直後でないと要求できないため、カメラより先に行う
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          try {
            const motionState = await DeviceMotionEvent.requestPermission();
            if (motionState !== 'granted') {
              showToast("歩数センサーを使えません。「着いた・次へ」を押して進めてください。", "warn");
            }
          } catch (e) {
            console.error(e);
          }
        }

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const orientationState = await DeviceOrientationEvent.requestPermission();
            if (orientationState !== 'granted') {
              showToast("方位センサーを使えません。矢印は体の向きに合わせて回りません。", "warn");
            }
          } catch (e) {
            console.error(e);
          }
        }

        await startCamera();
        requestWakeLock();

        window.addEventListener('devicemotion', handleMotion);
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleOrientation);
        } else {
          window.addEventListener('deviceorientation', handleOrientation);
        }

        hide(startScreen);
        show(arUi);
        playStepSound(false);
        setCharPose('wave', 2500);
        updateUI();
        // キャラクターが登場して行き先を確認してから、最初の案内を始める
        announceCurrentStep(`${route.dest.short}まで案内します。`);
      } finally {
        isStarting = false;
        updateStartButton();
      }
    });

    // 行き先を選ぶ画面へ戻る
    backHomeBtn.addEventListener('click', goHome);

    // テスト操作「1歩」
    testStepBtn.addEventListener('click', () => {
      stepCount++;
      addDistance(stepLength);
    });

    // テスト操作「＋5m」
    testAdvanceBtn.addEventListener('click', () => {
      stepCount += Math.round(5.0 / stepLength);
      addDistance(5.0);
    });

    // テスト操作「通行止め」（この先で混雑・工事が起きた想定）
    testDetourBtn.addEventListener('click', triggerDetour);

    // テスト操作「方角」：手で方角を変えるスライダーの開閉
    toggleSimBtn.addEventListener('click', () => {
      simPanel.classList.toggle('hidden');
      const isOpen = !simPanel.classList.contains('hidden');
      toggleSimBtn.setAttribute('aria-expanded', String(isOpen));
      // 閉じたら実機のコンパスに戻す
      if (!isOpen) isSimulatedHeading = false;
    });

    simHeadingSlider.addEventListener('input', (e) => {
      isSimulatedHeading = true;
      currentHeading = parseInt(e.target.value);
      simHeadingVal.textContent = `${currentHeading}° ${getDirectionName(currentHeading)}`;
      debugInfoEl.textContent = `方角 ${currentHeading}° ${getDirectionName(currentHeading)}（手動）`;
      updateArrowRotation();
    });

    // 初期描画
    initCharacter();
    renderStartSelect();
    renderRouteList();
    updateStepLengthUI();
    updateVoiceBtn();
  </script>
</body>
</html>
